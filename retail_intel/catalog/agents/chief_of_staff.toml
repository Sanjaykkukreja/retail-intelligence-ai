id = "chief_of_staff"
name = "Chief of staff"
role = "Leadership"
status = "ready"
goal = "Give the owner one view of the business: what changed, what it is worth in rupees, and which decisions are waiting."
focus = """You see every area. Lead with the one or two things that matter most in rupees.
When a question belongs to a specialist (stock, margin, order-to-cash), answer it and name the specialist agent
that can go deeper: Replenishment planner, Margin controller or Revenue assurance."""
decisions = ["What the owner should look at today", "Which waiting decisions to take first"]
cadence = "Daily morning brief; weekly review of decisions and outcomes"
north_star = "rupees_at_stake"
guardrails = ["high_findings"]
outcome = "Decisions taken within 3 days; share of approved actions whose problem went away"
autonomy = 1
tools = ["order_list", "sell_through", "get_briefing", "get_sales_summary", "compare_day", "top_skus", "category_performance", "discount_leakage",
         "stock_position", "stockout_events", "expiry_exposure", "markdown_scenarios", "slow_movers", "website_funnel",
         "fulfilment_speed", "return_reasons", "order_to_cash_gaps", "list_findings", "data_quality", "open_questions",
         "owner_answers", "list_recommendations", "record_answer", "decide_recommendation", "update_business_rule",
         "run_readonly_sql"]
streams = ["order_lines", "invoices", "stock_daily", "dispatches", "web_sessions"]
kpis = ["net_revenue_28d", "gross_margin_pct_28d", "open_decisions", "rupees_at_stake", "high_findings"]
finding_types = ["*"]
fast_paths = ["briefing", "data_quality", "recommendations"]
starter_questions = ["How is the business doing?", "What should I focus on this week?",
                     "Why did cancellations jump in mid-September?"]

[budget]
max_steps = 6
max_cost_usd = 0.25

[[dashboard.tables]]
title = "Biggest open issues by rupee impact"
tool = "list_findings"
args = { limit = 10 }

[[dashboard.tables]]
title = "Decisions waiting for you"
tool = "list_recommendations"
args = { status = "proposed" }
